<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galatama - Mini Fishing Leaderboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">GALATAMA</p>
        <h1>Mini Fishing Competition</h1>
        <p class="subtitle">Simulasi leaderboard real-time tanpa networking.</p>
      </div>
      <div class="session-card">
        <span class="label">Waktu sesi</span>
        <strong id="timer">01:00</strong>
        <span id="session-status" class="status waiting">Menunggu dimulai</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Kontrol sesi">
      <button id="start-button" type="button">Mulai Sesi</button>
      <button id="reset-button" type="button" class="secondary">Reset</button>
      <span id="catch-count">0 tangkapan</span>
    </section>

    <section class="dashboard">
      <article class="panel">
        <div class="panel-heading">
          <h2>Leaderboard Live</h2>
          <span class="live-dot">LIVE</span>
        </div>
        <ol id="leaderboard" class="leaderboard" aria-live="polite"></ol>
      </article>
      <article class="panel heaviest-panel">
        <div class="panel-heading">
          <h2>Tangkapan Terberat</h2>
        </div>
        <div id="heaviest-catch" class="heaviest-empty">Belum ada tangkapan.</div>
      </article>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
